[colors]
background = #1e1e2e
foreground = #cdd6f4
accent = #89b4fa
border = #45475a

[bar/example]
width = 100%
height = 30
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = "Hack Nerd Font:size=10;2"
modules-left = xwindow
modules-center = date
modules-right = cpu memory battery ethernet tray

[module/xwindow]
type = internal/xwindow
label = %title:ellipsize=middle%
label-maxlen = 50
label-empty = OpenBSD-Polybar

[module/date]
type = internal/date
interval = 5
date = %Y-%m-%d
time = %H:%M
label = %date% %time%

[module/cpu]
type = custom/script
exec = ~/.config/polybar/scripts/cpu.sh
interval = 5
label = %output%

[module/memory]
type = custom/script
exec = ~/.config/polybar/scripts/memory.sh
interval = 5
label = %output%

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 5
label = %output%

[module/ethernet]
type = internal/network
interface = re0
label-connected = Eth %local_ip%
label-disconnected = Eth disconnected

[module/tray]
type = internal/tray
tray-position = right
tray-padding = 2
tray-background = ${colors.background}
