backend = "xrender"

blur = {
  method = "dual_kawase";
  strength = 6;
  background = true;
  background-frame = false;
  background-fixed = false;
  kern = "3x3box";
}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'notification'",
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

shadow = true;
shadow-radius = 12;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.75;

shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'notification'",
  "class_g = 'slop'",
  "class_g = 'Polybar'"
];

corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'notification'",
  "class_g = 'Polybar'"
];

detect-client-opacity = true;

vsync = false;

use-damage = true;
